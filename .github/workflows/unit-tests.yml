name: Unit
on:
  workflow_call:
env:
  LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
permissions:
  contents: read
jobs:
  test:
    name: Unit
    timeout-minutes: 25
    runs-on: buildjet-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dangerous-git-checkout
      - uses: ./.github/actions/yarn-install
      # Generate measured coverage instead of a plain test run. This runs the
      # same unit tests but also emits text/json-summary/lcov reports.
      # NOTE: coverage is published as an artifact only; it does NOT gate CI.
      - name: Run unit tests with coverage
        run: |
          export NODE_OPTIONS="--max_old_space_size=8192"
          yarn test:coverage -- --no-isolate
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      # We could add different timezones here that we need to run our tests in
      - run: TZ=America/Los_Angeles yarn test -- --timeZoneDependentTestsOnly --no-isolate
      - name: Run API v2 tests
        working-directory: apps/api/v2
        run: |
          export NODE_OPTIONS="--max_old_space_size=8192"
          yarn test
