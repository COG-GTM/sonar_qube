# SonarQube Configuration for Cal.com
sonar.projectKey=COG-GTM_sonar_qube
sonar.projectName=COG-GTM/sonar_qube
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/playwright/**,**/tests/**,**/__tests__/**,**/test/**,**/.yarn/**,**/docs/**

# Language configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Security-focused rule configuration
sonar.qualitygate.wait=true

# Test exclusions
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/playwright/**,**/tests/**,**/__tests__/**,**/test/**

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/playwright/**,**/tests/**,**/__tests__/**,**/test/**,**/dist/**,**/.next/**

# Encoding
sonar.sourceEncoding=UTF-8
